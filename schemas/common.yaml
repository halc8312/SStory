# Common Frontmatter Fields - All Document Types
# 全タイプ共通フィールド定義

type: "object"
required:
  - type
  - category
  - title
  - version
  - created
  - last_updated
  - author
  - tags
  - status

properties:
  type:
    type: "string"
    enum: ["canon-document", "npc", "rule", "asset", "analysis", "overview"]
    description: "Document type indicating the structure and purpose of the document"
  category:
    type: "string"
    enum: [
      "lore", "geography", "races", "magic", "politics", "creatures",
      "culture", "economy", "religion", "maps", "transportation",
      "npcs", "rules", "overview", "assets", "analysis"
    ]
    description: "Content category/subject area of the document"
  title:
    type: "string"
    description: "Document title in Japanese (exclude project name)"
  version:
    type: "string"
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: "Semantic version (major.minor.patch)"
  created:
    type: "string"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    description: "Creation date in YYYY-MM-DD format"
  last_updated:
    type: "string"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    description: "Last update date in YYYY-MM-DD format"
  author:
    type: "string"
    description: "Primary author's GitHub username"
  tags:
    type: "array"
    items:
      type: "string"
    minItems: 1
    maxItems: 10
    description: "Related keywords (5-10 recommended)"
  status:
    type: "string"
    enum: ["draft", "review", "stable"]
    description: "Document status: draft=work in progress, review=awaiting review, stable=completed"
