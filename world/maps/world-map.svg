<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <style>
    .land { fill: #e6d5b8; stroke: #8b7355; stroke-width: 2; }
    .water { fill: #a0c8f0; }
    .island { fill: #e6d5b8; stroke: #8b7355; stroke-width: 1; }
    .label { font-family: 'DejaVu Sans', sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
    .title { font-family: 'DejaVu Sans', sans-serif; font-size: 20px; font-weight: bold; fill: #222; text-anchor: middle; }
  </style>
  <!-- Background -->
  <rect width="1000" height="800" class="water"/>
  <!-- Continents -->
  <!-- Elida (Central-West, largest) -->
  <polygon class="land" points="200,250 550,220 600,350 550,500 400,520 300,450 180,400"/>
  <!-- Lumiera (East) -->
  <polygon class="land" points="620,230 880,250 900,400 750,450 640,380"/>
  <!-- Chaos-Rea (South) -->
  <polygon class="land" points="320,520 680,500 720,700 400,750 280,650"/>
  <!-- Atlantis (West) -->
  <polygon class="land" points="60,320 240,300 260,450 120,480 50,400"/>
  <!-- Grimoire (North) -->
  <polygon class="land" points="300,80 500,70 520,180 380,200"/>
  <!-- Floating Islands (Sky Islands) -->
  <circle class="island" cx="420" cy="120" r="15"/>
  <circle class="island" cx="460" cy="100" r="10"/>
  <circle class="island" cx="400" cy="150" r="12"/>
  <circle class="island" cx="480" cy="130" r="8"/>
  <!-- Labels -->
  <text x="400" y="380" class="title">エルディア</text>
  <text x="750" y="350" class="title">リュミエラ</text>
  <text x="500" y="620" class="title">カオス・リア</text>
  <text x="150" y="400" class="title">アトランティス</text>
  <text x="410" y="150" class="title">グリモワール</text>
  <text x="440" y="100" class="label" font-size="10">浮島群</text>
  <!-- Legend -->
  <text x="50" y="780" class="label" font-size="10">SStory World Map - SVG (c) 2026</text>
</svg>
