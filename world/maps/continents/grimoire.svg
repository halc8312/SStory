<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <style>
    .land { fill: #e0e0e0; stroke: #808080; stroke-width: 2; }
    .water { fill: #a0c8f0; }
    .city { fill: #ff0000; }
    .label { font-family: sans-serif; font-size: 16px; fill: #333; text-anchor: middle; }
    .city-label { font-family: sans-serif; font-size: 12px; fill: #555; }
  </style>
  <rect width="800" height="600" class="water"/>
  <!-- Grimoire -->
  <polygon class="land" points="250,80 450,70 470,180 280,190"/>
  <!-- Cities / Sites -->
  <circle class="city" cx="360" cy="130" r="5"/>
  <text x="360" y="120" class="city-label">大結節点</text>
  <text x="360" y="220" class="label">グリモワール大陸</text>
</svg>
