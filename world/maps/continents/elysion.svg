<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <style>
    .land { fill: #e6d5b8; stroke: #8b7355; stroke-width: 2; }
    .water { fill: #a0c8f0; }
    .city { fill: #ff0000; }
    .label { font-family: sans-serif; font-size: 16px; fill: #333; text-anchor: middle; }
    .city-label { font-family: sans-serif; font-size: 12px; fill: #555; }
  </style>
  <rect width="800" height="600" class="water"/>
   <!-- Elysion continent shape -->
  <polygon class="land" points="150,150 500,120 550,300 500,450 350,480 250,400"/>
  <!-- Major cities -->
  <circle class="city" cx="380" cy="280" r="5"/>
  <text x="380" y="270" class="city-label">アストラリス</text>
  <circle class="city" cx="300" cy="200" r="3"/>
  <text x="300" y="190" class="city-label">ポートゼフィア</text>
  <circle class="city" cx="450" cy="350" r="3"/>
  <text x="450" y="340" class="city-label">シルバーグレイス</text>
  <text x="400" y="300" class="label">エリュシオン大陸</text>
</svg>
