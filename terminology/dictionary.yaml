# Terminology Dictionary for SStory Worldbuilding
# 
# This dictionary defines incorrect or non-standard terms and their correct Japanese equivalents.
# The terminology_check script uses this to detect and report issues in Markdown files.
#
# Usage: python tools/terminology_check.py

version: 1
terms:
  # Chinese characters / phrases (日中混在)
  - pattern: "五大陆"
    correct: "五大陸"
    description: "Chinese simplification of 大陸"
  - pattern: "装备"
    correct: "装備"
    description: "Chinese character for equipment"
  - pattern: "种族"
    correct: "種族"
    description: "Chinese character for race"
  - pattern: "规划"
    correct: "計画"
    description: "Chinese simplification of 畫"
  - pattern: "这个世界"
    correct: "この世界"
    description: "Chinese phrase instead of Japanese"
  - pattern: "金币"
    correct: "金貨"
    description: "Chinese currency character (币) instead of Japanese 貨"

  # English phrases that should be Japanese
  - pattern: "character creation"
    correct: "キャラクター作成"
    description: "English term for character creation"
  - pattern: "before racial"
    correct: "種族修正前"
    description: "English phrase for racial modifiers prior"
  - pattern: "protective cloak"
    correct: "保護のクローク"
    description: "English item name"
  - pattern: "pact系"
    correct: "契約系"
    description: "English loanword 'pact' should be Japanese '契約'"
  - pattern: "natural 20"
    correct: "自然20"
    description: "Natural 20 in dice rolls"
  - pattern: "natural 1"
    correct: "自然1"
    description: "Natural 1 in dice rolls"
  - pattern: "STR or DEX"
    correct: "STRまたはDEX"
    description: "English 'or' should be Japanese 'または'"
  - pattern: "ranged damage"
    correct: "遠隔攻撃"
    description: "English term for damage type"
  - pattern: "4d6 drop lowest"
    correct: "4d6（最低値除外）"
    description: "D&D dice rolling term"
  - pattern: "ritual"
    correct: "儀式"
    description: "English 'ritual' should be Japanese"
  - pattern: "saveボーナス"
    correct: "セーブボーナス"
    description: "Mixed English/Japanese; should be all Japanese katakana"
  - pattern: "Bardic Inspiration"
    correct: "音楽・演説による支援"
    description: "Bard class feature name"
  - pattern: "Jack of All Trades"
    correct: "多芸の才"
    description: "Bard class feature"
  - pattern: "Song of Rest"
    correct: "休息の歌"
    description: "Bard class feature"
  - pattern: "Cutting Words"
    correct: "言葉の斬撃"
    description: "Bard (College of Lore) feature"
  - pattern: "Action Surge"
    correct: "アクションサージ"
    description: "Fighter class feature"
  - pattern: "Second Wind"
    correct: "セカンドウインド"
    description: "Fighter class feature"
  - pattern: " to hit"
    correct: " 命中"
    description: "Phrase 'to hit' in attack descriptions"
  - pattern: "(property)"
    correct: "(特性)"
    description: "Item property label"
  - pattern: "penalty"
    correct: "ペナルティ"
    description: "English word should be katakana"
  - pattern: "bonus action"
    correct: "ボーナスアクション"
    description: "Game term"
  - pattern: "Hit Die"
    correct: "ヒットダイス"
    description: "HP determination dice"
  - pattern: "Spellcasting"
    correct: "呪文発動"
    description: "Magic casting ability"
  - pattern: "\\bartifact\\b"
    correct: "魔導器"
    description: "English term for magic item; use Japanese (word boundary)"
  - pattern: "\\bartefact\\b"
    correct: "魔導器"
    description: "English term (British spelling) for magic item; use Japanese (word boundary)"
  - pattern: "Difficulty Class"
    correct: "難易度"
    description: "DC full name"
  - pattern: "ability score increase"
    correct: "能力値増加"
    description: "Racial trait term"
  - pattern: " central Sea"
    correct: "中央海"
    description: "Incorrect space and English"
  - pattern: "海 monsters"
    correct: "海のモンスター"
    description: "Mixed Japanese/English"
  - pattern: " undead"
    correct: "アンデッド"
    description: "English word in Japanese text"
  - pattern: " ft"
    correct: "フィート"
    description: "Feet unit abbreviation; replace with Japanese"
  - pattern: "ft"
    correct: "フィート"
    description: "Feet unit abbreviation without space"
  - pattern: "arcane 寄り"
    correct: "秘術寄り"
    description: "Mixed English/Japanese in supplement"
  - pattern: " GP"
    correct: "金貨"
    description: "Gold Piece currency unit; use Japanese"

  # Additional common issues
  - pattern: " or "
    correct: "または"
    description: "English conjunction 'or' in Japanese text"
  - pattern: " and "
    correct: "かつ"
    description: "English conjunction 'and' in Japanese text"
  - pattern: " but "
    correct: "、"
    description: "English conjunction 'but' in Japanese text; replace with comma or 'が'"
