name: opencode

# This workflow runs the opencode AI agent in response to comments or manual dispatch.
# Permissions are minimized to only what's needed:
# - contents: read         -> checkout repository
# - pull-requests: write   -> post comments on PRs
# - issues: write          -> post comments on issues
# - id-token: write        -> allow OIDC token retrieval for opencode
# External actions are pinned to specific versions for security and reproducibility.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:

jobs:
  opencode:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (
          startsWith(github.event.comment.body, '/oc') ||
          startsWith(github.event.comment.body, '/opencode') ||
          contains(github.event.comment.body, ' /oc') ||
          contains(github.event.comment.body, ' /opencode') ||
          contains(github.event.comment.body, '\n/oc') ||
          contains(github.event.comment.body, '\n/opencode')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure git author
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@v1.14.31
        env:
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
        with:
          model: stepfun/step-3.5-flash-2603
          share: false
