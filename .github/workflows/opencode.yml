name: opencode

# This workflow runs the opencode AI agent in response to comments or manual dispatch.
# Permissions are minimized to only what's needed:
# - contents: read         -> checkout repository
# - pull-requests: write   -> post comments on PRs
# - issues: write          -> post comments on issues
# - id-token: write        -> allow OIDC token retrieval for opencode
# External actions are pinned to specific versions for security and reproducibility.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:

jobs:
  opencode:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        ) &&
        (
          github.event.comment.body == '/oc' ||
          startsWith(github.event.comment.body, '/oc ') ||
          github.event.comment.body == '/opencode' ||
          startsWith(github.event.comment.body, '/opencode ')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure git author
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Run opencode
        uses: anomalyco/opencode/github@557734bd130a68188454bc691e153f9f3731830e # v1.14.31
        env:
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
        with:
          model: stepfun/step-3.7-flash
          share: false
