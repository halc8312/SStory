name: Lint, Validate, and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Full validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run repository validators
        run: npm run validate

      - name: Run Node.js unit tests
        run: npm run test:node

      - name: Run Python unit tests
        run: npm run test:python

      # Keep this as an explicit integrity gate even though the validator step
      # reaches it through npm run validate. This makes accidental removal from
      # the aggregate script visible in Actions and guarantees the production
      # manifest/source checks run on both Linux and Windows.
      - name: Run map-production integrity gate
        run: npm run map:production:validate

      # The readiness declaration keeps planned production work green, but it
      # cannot bypass --strict-release once the release candidate is declared,
      # all bounded sheets are accepted, or any manifest job reaches
      # staging/published.
      - name: Run fail-closed map release readiness gate
        run: npm run map:production:release:ci
