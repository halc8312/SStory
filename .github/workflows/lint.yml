name: Lint and Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint '**/*.md' --ignore node_modules --ignore '**/evaluation/**'

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdown-link-check
        run: npm install -g markdown-link-check
      - name: Check links
        run: |
          cat > .markdown-link-check.json <<'EOF'
          {
            "ignorePatterns": [
              {"pattern": "http://localhost.*"},
              {"pattern": "https://localhost.*"},
              {"pattern": "^#.*"}
            ],
            "timeout": "10s",
            "retryOn429": true,
            "retryCount": 3
          }
          EOF
          markdown-link-check -q -c .markdown-link-check.json '**/*.md'

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v1
        with:
          files: '**/*.md'
          language: 'ja'
          exclude: |
            **/node_modules/**
            **/evaluation/**
            **/Language/**

  frontmatter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check YAML frontmatter presence
        run: |
          echo "Checking for YAML frontmatter in world/*.md files..."
          missing=0
          for file in world/**/*.md; do
            if ! head -1 "$file" | grep -q "^---"; then
              echo "❌ Missing frontmatter: $file"
              missing=$((missing+1))
            else
              echo "✅ Has frontmatter: $file"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "❌ $missing files missing YAML frontmatter"
            exit 1
          fi
          echo "✅ All files have YAML frontmatter"
