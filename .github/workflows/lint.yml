name: Lint and Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  grammar-check:
    name: Grammar (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run markdownlint
        run: npm run lint

  link-check:
    name: Link Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check links
        run: npm run links

  spell-check:
    name: Spelling (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v1
        with:
          files: '**/*.md'
          language: 'ja'
          exclude: |
            **/node_modules/**
            **/evaluation/**
            **/Language/**

  frontmatter-check:
    name: Frontmatter Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check frontmatter
        run: npm run frontmatter

  consistency-check:
    name: Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check consistency
        run: npm run consistency
